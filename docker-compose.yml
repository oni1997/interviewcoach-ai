services:
  postgres:
    image: postgres:16-alpine
    container_name: interviewcoach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: interviewcoach
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
      POSTGRES_DB: interviewcoach
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewcoach -d interviewcoach"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - interviewcoach-network

  backend:
    build: ./backend
    container_name: interviewcoach-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: interviewcoach
      DB_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
      DB_NAME: interviewcoach
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SERVER_PORT: "8080"
      AI_API_KEY: ${AI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-google/diffusiongemma-26b-a4b-it}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://interviewcoach-ai.mukai.co.za}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interviewcoach-network

  web:
    build: ./frontend
    container_name: interviewcoach-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8086:80"
    networks:
      - interviewcoach-network

volumes:
  pgdata:

networks:
  interviewcoach-network:
    external: true
    name: interviewcoach-network
